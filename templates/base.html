<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IGAP Private Limited</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        nav {
            background: #1f3c88;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .page-header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .page-header h1 {
            color: #1f3c88;
            margin-bottom: 8px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .stat-card h2 {
            font-size: 35px;
            color: #1f3c88;
            margin: 5px;
        }

        .stat-card p {
            font-size: 17px;
            margin: 8px;
        }

        footer {
            margin-top: 50px;
            background: #1f3c88;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<nav>
    <a href="/">Home</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/students">Students</a>
    <a href="/teachers">Teachers</a>
    <a href="/classes">Classes</a>
    <a href="/subjects">Subjects</a>
    <a href="/attendance">Attendance</a>
    <a href="/exams">Exams</a>
    <a href="/results">Results</a>
    <a href="/prediction">🎯 Prediction</a>
</nav>

<div class="container">

    {% block content %}
    {% endblock %}

</div>

<footer>
    <p>© 2026 IGAP Private Limited</p>
    <p>Class Management System</p>
</footer>

</body>
</html>
